# Copy to docker-compose.yml, fill in the key, then: docker compose up -d
services:
  codexgate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS reverse proxy (Caddy, nginx, Cloudflare Tunnel) in front
    volumes:
      - codexgate-data:/data
    environment:
      Gate__AdminUsername: admin
      # Gate__AdminPassword: set one here, or read /data/initial-admin-password.txt after the first start
      Gate__TrustForwardedHeaders: "true"   # only because the reverse proxy above sets X-Forwarded-*
      Gate__Upstreams__0__Name: openai
      Gate__Upstreams__0__BaseUrl: https://api.openai.com/v1
      Gate__Upstreams__0__ApiKey: ${OPENAI_API_KEY}
volumes:
  codexgate-data:
