name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: dotnet test -c Release --logger "console;verbosity=normal"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t codexgate .
      - name: Start and check it answers
        run: |
          docker run -d --name codexgate -p 8080:8080 -e Gate__AdminPassword=ci-admin-pass-1 codexgate
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'app.js'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/responses -H 'Content-Type: application/json' -d '{"model":"gpt-5.5"}')
          test "$code" = "401"
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/login -H 'X-CodexGate: 1' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-pass-1"}' > /dev/null
      - name: Logs
        if: always()
        run: docker logs codexgate

  remote:
    name: Server sessions (real tmux and Codex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the remote image
        run: docker build -t codexgate-remote --target remote .
      - name: Start a fake model API and the gateway
        run: |
          nohup node tools/mock-upstream.mjs 5191 > mock.log 2>&1 &
          docker run -d --name codexgate --network host \
            -e Gate__AdminPassword=ci-admin-pass-1 \
            -e Gate__Upstreams__0__BaseUrl=http://127.0.0.1:5191/v1 \
            -e Gate__Upstreams__0__ApiKey=sk-ci-upstream \
            codexgate-remote
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: End to end through the web terminal
        run: node tools/remote-smoke.mjs http://127.0.0.1:8080 ci-admin-pass-1
      - name: No terminal clients left behind
        run: |
          sleep 3
          left=$(docker exec codexgate sh -c 'n=0; for f in /proc/[0-9]*/cmdline; do tr "\000" " " < "$f" 2>/dev/null | grep -q "tmux -L codexgate -[C]" && n=$((n+1)); done; echo $n')
          echo "tmux control clients still running: $left"
          test "$left" = "0"
      - name: Logs
        if: always()
        run: |
          docker logs codexgate
          cat mock.log || true

  install:
    name: install.sh on a server whose port 443 is taken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Something else already owns port 443 (stands in for x-ui)
        run: |
          docker run -d --name other443 -p 443:80 nginx:alpine
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:443/ >/dev/null && break; sleep 1; done
      - name: A test certificate authority (Pebble) that really checks HTTP-01 on port 80
        run: |
          cat > pebble.json <<'JSON'
          {"pebble": {"listenAddress": "0.0.0.0:14000", "managementListenAddress": "0.0.0.0:15000",
            "certificate": "/test/certs/localhost/cert.pem", "privateKey": "/test/certs/localhost/key.pem",
            "httpPort": 80, "tlsPort": 5001, "ocspResponderURL": "", "externalAccountBindingRequired": false}}
          JSON
          docker run -d --name challtestsrv --network host ghcr.io/letsencrypt/pebble-challtestsrv:latest \
            -defaultIPv4 127.0.0.1 -defaultIPv6 ""
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            -v "$PWD/pebble.json:/pebble.json:ro" ghcr.io/letsencrypt/pebble:latest -config /pebble.json -dnsserver 127.0.0.1:8053
          for i in $(seq 1 30); do curl -fsSk https://127.0.0.1:14000/dir >/dev/null && break; sleep 1; done
      - name: Run install.sh
        run: |
          sudo bash install.sh --yes --source . --setup-port 39000 --https-port 9443 \
            --env Gate__Managed__AcmeDirectory=https://host.docker.internal:14000/dir \
            --env Gate__Managed__AcmeInsecureTls=true \
            --docker-arg --add-host=host.docker.internal:host-gateway
      - name: Finish setup through the page and check HTTPS
        run: node tools/install-smoke.mjs 39000 9443 codex.test "$(sudo sed -n 's/^SETUP_TOKEN=//p' /etc/codexgate/install.env)"
      - name: Port 443's owner was not touched
        run: curl -fsS http://127.0.0.1:443/ | grep -qi nginx && echo "port 443 still serves its own app"
      - name: Running install.sh again updates in place, even when its terminal dies half way
        run: |
          LOG=/var/log/codexgate-install.log
          sudo rm -f "$LOG"
          # A real terminal (script holds the pty) with a shell above the installer, like an SSH login.
          sudo script -qfc "bash install.sh --yes --source . \
            --env Gate__Managed__AcmeDirectory=https://host.docker.internal:14000/dir \
            --env Gate__Managed__AcmeInsecureTls=true \
            --docker-arg --add-host=host.docker.internal:host-gateway; true" /dev/null > /dev/null &
          for i in $(seq 1 60); do sudo grep -q "Updating the existing" "$LOG" 2>/dev/null && break; sleep 0.5; done
          sudo grep -q "Updating the existing" "$LOG"
          pid=$(sudo cat /run/codexgate-install.pid)
          sudo pkill -KILL -x script
          sleep 1
          sudo kill -0 "$pid"
          echo "the installer outlived its terminal"
          sudo bash install.sh --yes --source . | tee follow.txt
          grep -q "already running" follow.txt
          grep -q "updated and running" follow.txt
          [ "$(sudo stat -c %a "$LOG")" = 600 ]
          sudo test ! -e /run/codexgate-install.pid
          curl -fsSk --resolve codex.test:9443:127.0.0.1 https://codex.test:9443/healthz
      - name: Logs
        if: always()
        run: |
          docker logs codexgate || true
          docker logs pebble 2>&1 | tail -n 40 || true
